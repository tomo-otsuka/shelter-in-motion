<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Shelter in Motion — A visual travel log of a cross-country road trip across the United States during the COVID-19 lockdown, 2021–2022. 168 days. 20+ states. 13 national parks.">
  <meta name="theme-color" content="#0d0b09">
  <title>Shelter in Motion</title>

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif&family=JetBrains+Mono:wght@300;400&family=Spectral:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">

  <!-- Leaflet -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
        crossorigin="">

  <!-- App Styles -->
  <link rel="stylesheet" href="css/main.css">
  <link rel="stylesheet" href="css/map.css">
  <link rel="stylesheet" href="css/panel.css">
  <link rel="stylesheet" href="css/lightbox.css">
</head>
<body>

  <!-- Film grain overlay -->
  <div class="grain-overlay" aria-hidden="true"></div>

  <!-- Viewport vignette -->
  <div class="vignette-overlay" aria-hidden="true"></div>

  <!-- Map -->
  <div id="map" role="application" aria-label="Interactive trip map"></div>

  <!-- Landing overlay — click anywhere or wait to begin -->
  <header id="landing-overlay" class="landing-overlay" tabindex="0" role="button" aria-label="Click anywhere to begin exploring">
    <div class="landing-content">
      <h1 class="landing-title">Shelter in Motion</h1>
      <span class="landing-rule" aria-hidden="true"></span>
      <p class="landing-stats">
        <span class="stat">168 days</span>
        <span class="stat-divider">&middot;</span>
        <span class="stat">20+ states</span>
        <span class="stat-divider">&middot;</span>
        <span class="stat">13 national parks</span>
      </p>
      <p class="landing-subtitle">A cross-country road trip during lockdown, 2021–2022</p>
      <div class="landing-hint" aria-hidden="true">
        <span class="landing-hint-chevron"></span>
      </div>
    </div>
  </header>

  <!-- Stop detail panel -->
  <aside id="stop-panel" class="stop-panel" aria-label="Stop details">
    <div class="panel-content">
      <div class="panel-hero" data-empty="photos coming soon">
        <button id="panel-close" class="panel-close" aria-label="Close panel">&times;</button>
        <img id="panel-hero-img" class="panel-hero-img photo" alt="">
        <span id="panel-photo-count" class="panel-photo-count"></span>
      </div>
      <div class="panel-body">
        <div class="panel-meta">
          <span id="panel-chapter" class="panel-chapter stagger-in stagger-1"></span>
          <span id="panel-dates" class="panel-dates stagger-in stagger-1"></span>
        </div>
        <h2 id="panel-title" class="panel-title stagger-in stagger-2"></h2>
        <div id="panel-location" class="panel-location stagger-in stagger-2"></div>
        <div id="panel-highlights" class="panel-highlights stagger-in stagger-3"></div>
        <p id="panel-notes" class="panel-notes stagger-in stagger-4"></p>
        <div id="panel-entry-link" class="panel-entry-link stagger-in stagger-4"></div>
        <div id="panel-linked-stops" class="panel-linked-stops stagger-in stagger-4"></div>
        <div id="panel-photos" class="panel-photos stagger-in stagger-5"></div>
        <nav class="panel-nav stagger-in stagger-6" aria-label="Stop navigation">
          <button id="panel-prev" class="panel-nav-btn" aria-label="Previous stop">&larr; Previous</button>
          <span id="panel-counter" class="panel-counter"></span>
          <button id="panel-next" class="panel-nav-btn" aria-label="Next stop">Next &rarr;</button>
        </nav>
        <div class="panel-kbd-hint" aria-hidden="true">← → to navigate · esc to close</div>
      </div>
    </div>
  </aside>

  <!-- Lightbox container (populated by JS) -->
  <div id="lightbox-container"></div>

  <!-- Leaflet JS -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
          integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
          crossorigin=""></script>

  <!-- App -->
  <script type="module" src="js/main.js"></script>
</body>
</html>
